spring:
  application:
    name: resume-analyser-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/resume_analyser}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      # Schema is owned by Flyway (db/migration); Hibernate only checks the
      # entities agree with what Flyway already created, never generates DDL itself.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

app:
  jwt:
    # NFR-2.4: production must set JWT_SECRET; this default is dev-only.
    secret: ${JWT_SECRET:dev-only-secret-change-me-32-bytes-minimum-please}
    # NFR-2.1: JWT sessions <= 24h.
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  # Where uploaded resume files are written; Resume.fileRef points into this
  # directory. A local disk is a stand-in for real object storage (S3, GCS, ...)
  # -- swapping it out later only touches ResumeStorageService.
  storage:
    resume-dir: ${RESUME_STORAGE_DIR:./data/resumes}
  ml-service:
    # Base URL of the FastAPI ML service (see ml-service/app/main.py) this backend
    # calls for parsing, matching, ATS scoring, and analysis.
    base-url: ${ML_SERVICE_BASE_URL:http://localhost:8000}
  cors:
    # Origins allowed to call this API from a browser (the Angular dev server by
    # default). Comma-separated for multiple origins in other environments.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
