# Runs every module's tests on each pull request to master and on each push
# to master. The three jobs run in parallel, so a frontend change never waits
# on the ML service's install.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Two branches once both added a V7 migration; Flyway refuses to start
      # when two files share a version, so catch it before merge.
      - name: Check Flyway migration versions are unique
        run: |
          dupes=$(find src/main/resources/db/migration -name 'V*__*.sql' -printf '%f\n' | sed -n 's/^\(V[0-9][0-9.]*\)__.*/\1/p' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate migration versions: $dupes"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: mvn -B -q test

      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  ml-service:
    name: ML service tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      # CPU-only torch first (see requirements.txt), or pip pulls the much
      # larger CUDA build.
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # The matcher tests load the real all-MiniLM-L6-v2 embedding model
      # (about 90 MB from Hugging Face); keep it between runs. The NER tests
      # use fakes, so the trained NER model is never needed here.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No dependencies to install: the tests use Node's built-in runner.
      - name: Run tests
        run: npm test
