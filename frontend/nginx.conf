# A template: the nginx image fills in ${API_BASE_URL} and ${BACKEND_URL} from the
# environment when the container starts (see the Dockerfile), so each deployment sets
# them without a code change. nginx's own $variables are left alone.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Resumes are up to 5 MB.
    client_max_body_size 6m;

    # Where the pages send API calls: "/api" behind the proxy below (same origin, no
    # CORS), or the backend's own URL. A plain static server for local development
    # has no such rule, so it serves src/js/config.js (http://localhost:8080) instead.
    location = /js/config.js {
        default_type application/javascript;
        add_header Cache-Control "no-store";
        return 200 "export const API_BASE_URL = '${API_BASE_URL}';\n";
    }

    location /api/ {
        proxy_pass ${BACKEND_URL}/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An analysis that uses the AI engine can take a while.
        proxy_read_timeout 120s;
    }

    # Multi-page app: every page is a real .html file, so no single-page fallback is needed.
    location / {
        try_files $uri $uri/ =404;
    }
}
