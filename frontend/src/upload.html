<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Upload resume · Smart Resume Analyser</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <header id="app-header"></header>

    <main class="container py-4" style="max-width: 760px">
      <h1 class="h2 mb-4">Upload your resume</h1>

      <section class="card shadow-sm mb-4">
        <div class="card-body">
          <label for="resume-file" class="form-label">Resume file (PDF or DOCX, up to 5 MB)</label>
          <input id="resume-file" type="file" class="form-control mb-3" accept=".pdf,.docx" />

          <div id="upload-error" class="alert alert-danger" role="alert" hidden></div>

          <button id="upload-submit" type="button" class="btn btn-primary">Upload</button>
          <span id="upload-note" class="small text-body-secondary ms-2" hidden>
            Analysing — this can take a few seconds.
          </span>
        </div>
      </section>

      <!-- Filled in after a successful upload. -->
      <section id="profile-card" class="card shadow-sm mb-4" hidden>
        <div class="card-body">
          <h2 class="h4">Extracted profile</h2>
          <p class="mb-1 fw-semibold" id="profile-name"></p>
          <p class="text-body-secondary" id="profile-email"></p>
          <div id="profile-skills" class="d-flex flex-wrap gap-2 mb-3"></div>

          <div id="profile-experience-section" hidden>
            <h3 class="h5">Experience</h3>
            <ul id="profile-experience"></ul>
          </div>

          <div id="profile-education-section" hidden>
            <h3 class="h5">Education</h3>
            <ul id="profile-education"></ul>
          </div>

          <a href="dashboard.html" class="btn btn-outline-primary btn-sm">See your dashboard</a>
        </div>
      </section>

      <section class="card shadow-sm">
        <div class="card-body">
          <h2 class="h4">Upload history</h2>
          <p id="history-empty" class="mb-0">No resumes uploaded yet.</p>
          <ul id="history-list" class="list-group list-group-flush" hidden></ul>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="js/pages/upload.js"></script>
  </body>
</html>
