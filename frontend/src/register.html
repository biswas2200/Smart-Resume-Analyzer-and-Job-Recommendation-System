<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Create account · Smart Resume Analyser</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <header id="app-header"></header>

    <main class="container py-5">
      <form id="register-form" class="card auth-card mx-auto shadow-sm" novalidate>
        <div class="card-body p-4">
          <h1 class="h3 mb-4">Create account</h1>

          <div id="register-error" class="alert alert-danger" role="alert" hidden></div>

          <div class="mb-3">
            <label for="register-email" class="form-label">Email</label>
            <input id="register-email" type="email" class="form-control" autocomplete="email"
                   aria-describedby="register-email-error" />
            <div id="register-email-error" class="invalid-feedback"></div>
          </div>

          <div class="mb-3">
            <label for="register-password" class="form-label">Password</label>
            <input id="register-password" type="password" class="form-control" autocomplete="new-password"
                   aria-describedby="register-password-hint register-password-error" />
            <div id="register-password-hint" class="form-text">8 to 72 characters.</div>
            <div id="register-password-error" class="invalid-feedback"></div>
          </div>

          <div class="mb-4">
            <label for="register-confirm-password" class="form-label">Confirm password</label>
            <input id="register-confirm-password" type="password" class="form-control" autocomplete="new-password"
                   aria-describedby="register-confirm-password-error" />
            <div id="register-confirm-password-error" class="invalid-feedback"></div>
          </div>

          <button id="register-submit" type="submit" class="btn btn-primary w-100">Create account</button>

          <p class="text-center text-body-secondary small mt-3 mb-0">
            Already have an account? <a href="login.html">Sign in</a>
          </p>
        </div>
      </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="js/pages/register.js"></script>
  </body>
</html>
